version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: apeployed-db
    environment:
      POSTGRES_USER: apeployee
      POSTGRES_PASSWORD: apeployee_secure_password_change_me
      POSTGRES_DB: apeployed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apeployee"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apeployed-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://apeployee:apeployee_secure_password_change_me@postgres:5432/apeployed?schema=public
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apeployed-frontend
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: apeployed-network
